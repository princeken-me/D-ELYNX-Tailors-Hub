<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6EE" />
      <stop offset="25%" stop-color="#E5C378" />
      <stop offset="60%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#C59B27" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="506" height="506" x="3" y="3" rx="105" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Monogram & Tailoring Geometry -->
  <g filter="url(#subtleGlow)" transform="translate(64, 64)">
    <!-- Outer Diamond / Architectural Frame -->
    <path d="M192,24 L360,192 L192,360 L24,192 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.4" />
    
    <!-- Bold Luxury 'D' and Needle/Spool Motif -->
    <!-- Stylized D contour -->
    <path d="M100,84 L190,84 C260,84 310,130 310,192 C310,254 260,300 190,300 L100,300 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Tailor's Golden Needle intersecting diagonally -->
    <path d="M70,314 L300,70" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Needle eyelet -->
    <ellipse cx="282" cy="88" rx="5" ry="12" transform="rotate(45 282 88)" fill="#09090b" stroke="url(#goldGrad)" stroke-width="4" />
    <!-- Precision thread loop -->
    <path d="M292,78 C330,40 350,90 310,120 C270,150 210,120 180,160" fill="none" stroke="#F9F6EE" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />
    
    <!-- Inner faceted core -->
    <circle cx="192" cy="192" r="8" fill="url(#goldGrad)" />
  </g>
</svg>
